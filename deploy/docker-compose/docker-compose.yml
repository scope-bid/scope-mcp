version: "3.9"

services:
  scope-legal-gateway:
    image: scopebid/scope-mcp:1.0.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SCOPE_API_BASE: https://scope.bid
      SCOPE_API_TOKEN: ${SCOPE_API_TOKEN}
      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
