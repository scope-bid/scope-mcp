# Publish all four Scope MCP packages to npm via Trusted Publishing.
#
# Trusted Publishing is npm's OIDC-based flow: the GitHub Actions runner
# exchanges its OIDC token for a short-lived npm publish credential, so
# we never store an NPM_TOKEN secret in the repo. This is the long-term
# fix for the 2FA pain we hit with the npm CLI (security-key + recovery
# codes are still required for local publishes, but CI doesn't need them).
#
# Setup (one-time, per package, in the npm UI):
#   https://www.npmjs.com/package/<package>/access -> "Publishing access"
#   -> Add trusted publisher -> GitHub Actions
#     - Organization: scope-bid
#     - Repository:   scope-mcp
#     - Workflow:     publish.yml
#     - Environment:  npm-publish
#
# Trigger: push a git tag matching v*.*.* on main. Example:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Publish order matters: mcp-core ships first (the other three depend
# on it). The wait step gives the npm registry a moment to propagate
# the mcp-core publish before the verticals resolve the dep.

name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    # OIDC permissions: id-token: write is required for Trusted Publishing.
    # contents: read is the default; declaring it here makes intent explicit.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm version supports Trusted Publishing
        # Trusted Publishing requires npm >= 11.5.1. The runner's default
        # npm 10 will not work. Upgrade in-place; setup-node@v4 doesn't
        # let us pin npm directly.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install workspace dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build --workspaces --if-present

      - name: Publish @scope-bid/mcp-core
        working-directory: packages/mcp-core
        run: npm publish --provenance --access public

      - name: Wait for mcp-core to propagate
        # The three vertical packages declare a runtime dep on mcp-core.
        # npm's registry CDN takes a few seconds to make a freshly
        # published version visible to installs. 20s is conservative.
        run: sleep 20

      - name: Publish @scope-bid/scope-mcp
        working-directory: packages/scope-mcp
        run: npm publish --provenance --access public

      - name: Publish @scope-bid/scope-claims-mcp
        working-directory: packages/scope-claims-mcp
        run: npm publish --provenance --access public

      - name: Publish @scope-bid/scope-aec-mcp
        working-directory: packages/scope-aec-mcp
        run: npm publish --provenance --access public

      # ---- MCP Registry --------------------------------------------------
      # npm (above) and the MCP Registry are two separate systems. Keeping the
      # registry submission in this same tag-triggered job is what makes them
      # publish together, so they can never drift the way they did between
      # 1.0.1 and 1.0.3 (npm moved, registry did not).
      #
      # The bid.scope namespace is reverse-DNS; the verified domain is
      # scope.bid. Auth is an ed25519 private key in hex, stored as the
      # BID_SCOPE_KEY repo secret. mcp-core has no server.json (internal dep,
      # not a published namespace), so only the three verticals are submitted.

      - name: Sync server.json versions from package.json
        # Source of truth for the published version is package.json (the tag).
        # Rewrite each server.json's version + package pin to match, so the
        # registry submission always matches what npm just published even if a
        # server.json bump was forgotten.
        run: |
          for pkg in scope-mcp scope-claims-mcp scope-aec-mcp; do
            v=$(node -p "require('./packages/$pkg/package.json').version")
            tmp=$(mktemp)
            jq --arg v "$v" '.version = $v | .packages[0].version = $v' \
              "packages/$pkg/server.json" > "$tmp" && mv "$tmp" "packages/$pkg/server.json"
            echo "$pkg server.json -> $v"
          done

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate to the MCP Registry (DNS, scope.bid)
        run: |
          ./mcp-publisher login dns \
            --domain scope.bid \
            --private-key "${{ secrets.BID_SCOPE_KEY }}"

      - name: Publish server.json to the MCP Registry
        run: |
          ./mcp-publisher publish packages/scope-mcp/server.json
          ./mcp-publisher publish packages/scope-claims-mcp/server.json
          ./mcp-publisher publish packages/scope-aec-mcp/server.json

      - name: Summary
        run: |
          echo "Published packages:" >> $GITHUB_STEP_SUMMARY
          echo "- @scope-bid/mcp-core@$(node -p "require('./packages/mcp-core/package.json').version")" >> $GITHUB_STEP_SUMMARY
          echo "- @scope-bid/scope-mcp@$(node -p "require('./packages/scope-mcp/package.json').version")" >> $GITHUB_STEP_SUMMARY
          echo "- @scope-bid/scope-claims-mcp@$(node -p "require('./packages/scope-claims-mcp/package.json').version")" >> $GITHUB_STEP_SUMMARY
          echo "- @scope-bid/scope-aec-mcp@$(node -p "require('./packages/scope-aec-mcp/package.json').version")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All published with sigstore provenance attestations." >> $GITHUB_STEP_SUMMARY
          echo "Registry: bid.scope/{legal,claims,aec} submitted at the same version." >> $GITHUB_STEP_SUMMARY
